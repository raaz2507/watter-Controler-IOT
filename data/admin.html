<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin panal</title>
	<link rel="stylesheet" href="./css/admin.css">
</head>
<body>
	<article id="tanksetup" class="dashboardCard">
		<div class="cardHeader">
			<span class="title">Wifi Setup</span>
			<div class="iconBox">
				<span class="cardIcon">🛠️</span>
			</div>
		</div>

		<div class="cardBody">
			<button class="miniBtn" onclick="window.location.href = 'wifisetup.html'">Setup</button>
		</div>
		<section class="notificationQueue">
			<div class="queueHead">
				<h3>Event Log</h3>
				<button id="clearLogBtn">Clear</button>
			</div>

			<ul id="eventLog">
				<li class="logItem success">
					<span class="logTime">12:20</span>
					<span>Motor started successfully</span>
				</li>
			</ul>
		</section>
	</article>
	<script type="module" src="./js/admin.js"></script>
</body>
</html>
