<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="shortcut icon" type="image/x-icon" 
			href="data:image/svg+xml,
			<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
				<text y=%22.9em%22 font-size=%2290%22>🐦‍🔥</text>
			</svg>" 
		/>

		<title>Water Tank Controler</title>

		<link rel="stylesheet" href="../css/dashboard.css" />
	
	</head>
	<body class="waterBg">
		
		<header></header>
		<nav></nav>

		
		<main class="dashboardMain">
			<div class="upperPart">
				
				<!-- <div class="tankStatus">
				</div> -->
				<section class="tank-visuals">
					<div id="tank-meter"><!-- Tank SVG here --></div>
					<div id="level-controller"><!-- Tank Laval Selector is here --></div>
				</section>
				<!-- Live Aleart Panal -->
				<section class="statusCard">

					<div class="panelHead">
						<h3 class="groupTitle">Live Alerts</h3>
					</div>

					<div id="tankCapacity" class="metric flowPercent success">
						<span class="badge">Tank Total Capacity</span>
						<span class="value">500 L</span>
					</div>

					<div id="flowPercent" class="metric flowPercent success">
						<span class="badge">Flow %</span>
						<span class="value">00%</span>
					</div>

					<div id="flowRate" class="metric flowRate danger">
						<span class="badge">Flow</span>
						<span class="value">00 L/min</span>
					</div>

					<div id="waterRemaining" class="metric waterRemaining warning">
						<span class="badge">Remaining</span>
						<span class="value">00 L</span>
					</div>

					<div id="approxFillTime" class="metric fillTime danger">
						<span class="badge">Approx Fill Time</span>
						<span class="value">00 min</span>
					</div>

					<div id="lastFillTime" class="metric fillTime danger">
						<span class="badge">Last Fill Time</span>
						<span class="value">00 min</span>
					</div>

				</section>
				<div class="panel">
					
					<div class="controls">
						<!-- SYSTEM GROUP -->
						<section class="cardGroup">
							<h2 class="groupTitle">🔋 System</h2>

							<div class="cardGrid">
								<article id="batteryArea" class="dashboardCard">
									<div class="cardHeader">
										<span class="title">Battery</span>

										<div class="iconBox">
											<span class="cardIcon">🔋</span>
										</div>
									</div>
									<div class="cardBody">
										<span class="value">00%</span>
									</div>
								</article>

								<article id="wifiStrength" class="dashboardCard">
									<div class="cardHeader">
										<span class="title">WiFi</span>
										<div class="iconBox">
											<span class="cardIcon">📶</span>
										</div>
									</div>
									<div class="cardBody">
										<span class="value">00%</span>
									</div>
								</article>

								<article id="deviceStatus" class="dashboardCard">
									<div class="cardHeader">
										<span class="title">Device</span>
										<div class="iconBox">
											<span class="cardIcon">🤖</span>
										</div>
									</div>
									<div class="cardBody">
										<span class="value">______</span>
									</div>
								</article>
							</div>
						</section>

						<!-- CONTROL GROUP -->
						<section class="cardGroup">
							<h2 class="groupTitle">⚙ Control</h2>
							<div class="cardGrid">
								<article class="dashboardCard">
									<div class="cardHeader">
										<span class="title">Motor</span>
										<div class="iconBox">
											<span class="cardIcon">⚙️</span>
										</div>
									</div>

									<div class="cardBody">
										<div class="switchContainer" id="MotorSwitchBtn"></div>
									</div>
								</article>

								<article class="dashboardCard">
									<div class="cardHeader">
										<span class="title">Auto Mode</span>
										<div class="iconBox">
											<span class="cardIcon">🧠</span>
										</div>
									</div>

									<div class="cardBody ">
										<div class="btnConrainer">
											<div class="switchContainer" id="AutomaionSwitchBtn"></div>
											<button class="btn" onclick="window.location.href = './automationSetting.html'"> Setup 🛠️</button>
										</div>
									</div>
								</article>
								<!-- <article id="automationSetup" class="dashboardCard">
									<div class="cardHeader">
										<span class="title">Automation Settings</span>
										<div class="iconBox">
											<span class="cardIcon">🛠️</span>
										</div>
									</div>

									<div class="cardBody">
										<button
											class="miniBtn"
											onclick="window.location.href = './automationSetting.html'">
											Setup 🛠️
										</button>
									</div>
								</article> -->
								<article id="tanksetup" class="dashboardCard">
									<div class="cardHeader">
										<span class="title">Tank Setup</span>
										<div class="iconBox">
											<span class="cardIcon">🛠️</span>
										</div>
									</div>

									<div class="cardBody">
										<button class="btn" onclick="window.location.href = './tanksetup.html'"> Setup ⚙️</button>
									</div>
								</article>
							</div>
						</section>
					</div>
				</div>

			</div>
			<div class="downPart">
				<section class="chart-container">
					<div class="toogleBtnContainer">
						<label class="toggle-switch">
							<input type="checkbox" id="chartToggle">
							<span class="slider"></span>
						</label>
						<span class="modeText">Daily Chart</span>
					</div>

					<canvas id="myChart"></canvas>
				</section>
			</div>
		</main>

		<section id="">
			<div class="controls">
				<div style="margin-bottom: 10px; font-size: 1.2rem">Control Level</div>
				<input type="range" id="levelSlider" min="0" max="100" value="0" />
				<div id="status" style="margin-top: 10px; color: #4facfe">Status: Charging</div>
			</div>
		</section>

		<footer></footer>

		<!-- <div id="modalOverlay" class="overlay">
			<div class="modal-card">
				<div class="modal-header">
					<div class="close-btn" id="closePopUp">&times;</div>
				</div>
				<div class="modal-body"></div>
				<div class="modal-footer"></div>
			</div>
		</div> -->

		<!-- <script src="/socket.io/socket.io.js"></script> -->
		<!-- <script src="../js/chart.umd.js"></script> -->
		 <script src="./js/nouislider.js"></script>
		<script type="module" src="../js/dashboard.js"></script>
	</body>
</html>
